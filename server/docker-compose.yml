name: claude-token-meter

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/token-aliases.yaml"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./token-aliases.yaml:/etc/otelcol/token-aliases.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP（客户端默认用这个）
    depends_on: [loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.17
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-usage.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [loki]
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
